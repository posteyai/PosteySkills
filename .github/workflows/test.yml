name: test

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Tests
        run: node --test

      - name: Check version consistency
        run: node scripts/check-versions.js

      # Two scopes on purpose. Full repo: secret-shaped patterns + committed
      # high-entropy hashes (root tests/ is skipped inside the scanner —
      # synthetic secret-shaped fixtures). No private secret here: the private
      # terms (person names, internal repo/product names) legitimately appear
      # in committed infra files like CLAUDE.md and would false-positive.
      - name: Check for leaks (full repo, committed denylist)
        run: node scripts/check-leaks.js .

      # Shipped skill content only, with the private term list merged in.
      # LEAK_EXTRA_TERMS is newline- or comma-separated plaintext terms; it is
      # EMPTY on fork PRs (no secrets) — maintainers re-check on merge.
      - name: Check for leaks (shipped content, private denylist)
        run: node scripts/check-leaks.js skills
        env:
          LEAK_EXTRA_TERMS: ${{ secrets.LEAK_EXTRA_TERMS }}

      # S9.6 — enforcement. The responsibility contract is prose until a build
      # fails on it. Offline: reads the committed snapshot, so it runs on forks.
      - name: Check skill/MCP capability overlap
        run: node scripts/check-capability-overlap.js

      # Replaces check-platform-sync.js (S9.5). That script compared SKILL.md's
      # `platforms:` against postey.js's SOCIAL_PLATFORMS — two hand-maintained
      # copies agreeing with each other, and it soft-skipped to green when either
      # was absent. Both now derive from capability-snapshot.json; the offline
      # tests hold the repo consistent, this step holds it against the server.
      - name: Check capability snapshot is current
        run: node scripts/refresh-capability-snapshot.js --check
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_STAGING_URL }}
          POSTEY_API_KEY: ${{ secrets.MCP_STAGING_API_KEY }}

      # Source-parse mode soft-skips here (no sibling backend checkout in CI).
      # Setting the MCP_STAGING_URL + MCP_STAGING_API_KEY secrets switches on
      # runtime verification, which HARD-FAILS if the fetch fails — a
      # configured check never degrades into a green skip.
      - name: Check MCP tool sync
        run: |
          MCP_TOOLS_DIR=../postey-backend/app/core/mcp/tools \
          node scripts/check-mcp-tool-sync.js
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_STAGING_URL }}
          POSTEY_API_KEY: ${{ secrets.MCP_STAGING_API_KEY }}

