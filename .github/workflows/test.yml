name: test

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Tests
        run: node --test

      - name: Check version consistency
        run: node scripts/check-versions.js

      # tests/ is excluded on purpose: it contains synthetic secret-shaped fixtures.
      # Note: secrets are empty on fork PRs, so external PRs are checked against the
      # committed hashes only; maintainers re-check on merge.
      - name: Check for private-identifier leaks
        run: node scripts/check-leaks.js skills README.md CLAUDE.md
        env:
          LEAK_EXTRA_TERMS: ${{ secrets.LEAK_EXTRA_TERMS }}

      - name: Check platform sync
        run: node scripts/check-platform-sync.js

      - name: Check MCP tool sync
        run: |
          MCP_TOOLS_DIR=../MarqetiveBackendV2/app/core/mcp/tools \
          node scripts/check-mcp-tool-sync.js
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_STAGING_URL }}

